[project]
name = "frame-tool"
version = "0.1.0"
description = "Add white/black borders and EXIF metadata to JPG photos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emi Mer" }]
dependencies = [
    "pydantic>=2.5",
    "Pillow>=10.0",
    "PySide6>=6.6",
    "typer>=0.12",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.scripts]
frame-tool = "frame_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frame_tool"]

[tool.hatch.build.targets.sdist]
include = ["src/frame_tool", "README.md", "pyproject.toml"]
